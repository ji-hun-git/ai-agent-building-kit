<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="head-b2b2aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b2b2aa"/></marker><marker id="head-cf3a2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#cf3a2f"/></marker></defs><rect width="1400" height="680" fill="#fff"/><text x="40" y="54" font-size="28" font-weight="700" fill="#1b1b19" text-anchor="start">Five checkpoints: text is screened wherever it crosses a trust boundary</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">Rules run first and cannot be argued with; a guard model or a moderation API adds what rules cannot see.</text><rect x="40" y="130" width="170" height="100" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="125.0" y="175.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">User</text><text x="125.0" y="197.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">a request</text><rect x="250" y="130" width="290" height="100" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="395.0" y="164.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Prompt guard</text><text x="395.0" y="186.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">strip hidden characters; redact</text><text x="395.0" y="206.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">secrets and IDs; moderation</text><text x="526" y="154" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><rect x="580" y="130" width="220" height="100" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="690.0" y="175.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Model</text><text x="690.0" y="197.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">proposes</text><rect x="840" y="130" width="290" height="100" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="985.0" y="164.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Output guard</text><text x="985.0" y="186.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">strip and redact; images and</text><text x="985.0" y="206.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">links only to listed hosts</text><text x="1116" y="154" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><rect x="1170" y="130" width="190" height="100" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1265.0" y="186.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Answer</text><rect x="40" y="320" width="170" height="100" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="125.0" y="365.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Documents</text><text x="125.0" y="387.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">at ingestion</text><rect x="250" y="320" width="290" height="100" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="395.0" y="354.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Data guard</text><text x="395.0" y="376.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">hidden characters and markup;</text><text x="395.0" y="396.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">secrets and IDs; injection flag</text><text x="526" y="344" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><rect x="580" y="320" width="220" height="100" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="690.0" y="354.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Toolbox</text><text x="690.0" y="376.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">policy, trifecta, lockdown,</text><text x="690.0" y="396.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">approval, run once</text><text x="786" y="344" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">4</text><rect x="840" y="320" width="290" height="100" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="985.0" y="354.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Egress guard</text><text x="985.0" y="376.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">refuses hidden text, secrets,</text><text x="985.0" y="396.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">IDs and unlisted URLs</text><text x="1116" y="344" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><rect x="1170" y="320" width="190" height="100" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1265.0" y="365.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Outbound tools</text><text x="1265.0" y="387.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">post, email, fetch</text><rect x="250" y="500" width="290" height="80" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="395.0" y="535.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Read tools</text><text x="395.0" y="557.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">search, HR system, files</text><rect x="840" y="500" width="290" height="80" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="985.0" y="524.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Stored guard</text><text x="985.0" y="546.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">what a write stores: the</text><text x="985.0" y="566.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">answer&#x27;s rules, no classifier</text><text x="1116" y="524" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><rect x="1170" y="500" width="190" height="80" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1265.0" y="535.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Write tools</text><text x="1265.0" y="557.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">briefs, notes, records</text><path d="M210,180 L249,180" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M540,180 L579,180" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M800,180 L839,180" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M1130,180 L1169,180" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M210,370 L249,370" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M800,370 L839,370" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M1130,370 L1169,370" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><text x="820" y="360" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">out</text><path d="M760,230 L760,319" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><text x="770" y="275" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="start">tool calls</text><path d="M520,320 L520,280 L690,280 L690,231" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><text x="605" y="272" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">cleaned results</text><path d="M660,420 L660,460 L480,460 L480,499" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M340,500 L340,421" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M784,420 L784,540 L839,540" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><text x="794" y="530" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="start">writes</text><path d="M1130,540 L1169,540" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><text x="40" y="630" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">What the rules guarantee holds whatever the model does. A classifier is one more layer, never the boundary.</text></svg>
