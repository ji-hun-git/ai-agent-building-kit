<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="head-b2b2aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b2b2aa"/></marker><marker id="head-cf3a2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#cf3a2f"/></marker></defs><rect width="1400" height="560" fill="#fff"/><text x="40" y="54" font-size="28" font-weight="700" fill="#1b1b19" text-anchor="start">Check what is current, then build in the order failures close</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">The building-ai-agents skill as a coding agent runs it. Step 0 runs every time; the rest scale to the request.</text><rect x="40" y="130" width="305" height="150" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="192.5" y="178.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Freshness check</text><text x="192.5" y="200.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Versions, advisories and model</text><text x="192.5" y="220.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">lineups, checked live and</text><text x="192.5" y="240.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">recorded in a stack lock</text><text x="331" y="154" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">0</text><rect x="375" y="130" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="527.5" y="178.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Frame the job</text><text x="527.5" y="200.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Five real tasks, the data,</text><text x="527.5" y="220.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">the actions and the risk tier;</text><text x="527.5" y="240.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">build or buy</text><text x="666" y="154" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">1</text><path d="M345,205.0 L374,205.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="710" y="130" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="862.5" y="178.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Simplest architecture</text><text x="862.5" y="200.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Call → workflow → one agent</text><text x="862.5" y="220.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">→ sub-agents, climbing only</text><text x="862.5" y="240.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">when the evals fail</text><text x="1001" y="154" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">2</text><path d="M680,205.0 L709,205.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="1045" y="130" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1197.5" y="178.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Evals first</text><text x="1197.5" y="200.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Cases from the failure</text><text x="1197.5" y="220.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">catalogue, written before</text><text x="1197.5" y="240.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">the code; pass^k</text><text x="1336" y="154" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">3</text><path d="M1015,205.0 L1044,205.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="40" y="350" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="192.5" y="398.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Build the ten layers</text><text x="192.5" y="420.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">In order; each one closes</text><text x="192.5" y="440.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">a failure the layers below</text><text x="192.5" y="460.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">leave open</text><text x="331" y="374" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">4</text><rect x="375" y="350" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="527.5" y="398.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Threat model</text><text x="527.5" y="420.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Untrusted inputs, the trifecta</text><text x="527.5" y="440.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">check, the OWASP map,</text><text x="527.5" y="460.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">red-team cases</text><text x="666" y="374" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">5</text><path d="M345,425.0 L374,425.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="710" y="350" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="862.5" y="398.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Release through the gate</text><text x="862.5" y="420.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Versioned bundle, required</text><text x="862.5" y="440.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">evals, then shadow,</text><text x="862.5" y="460.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">canary and ramp</text><text x="1001" y="374" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">6</text><path d="M680,425.0 L709,425.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="1045" y="350" width="305" height="150" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1197.5" y="398.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Hand off</text><text x="1197.5" y="420.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Spec, eval plan, threat model,</text><text x="1197.5" y="440.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">stack lock and a log</text><text x="1197.5" y="460.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">of decisions</text><text x="1336" y="374" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><path d="M1015,425.0 L1044,425.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M1197.5,280 L1197.5,315 L192.5,315 L192.5,349" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/></svg>
