<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1330" viewBox="0 0 1400 1330" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="head-b2b2aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b2b2aa"/></marker><marker id="head-cf3a2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#cf3a2f"/></marker></defs><rect width="1400" height="1330" fill="#fff"/><text x="40" y="54" font-size="28" font-weight="700" fill="#1b1b19" text-anchor="start">Every query crosses the controls; every change must cross the gate</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">The architecture in the video, built one failure at a time. Small numbers are the steps in which each part appeared.</text><rect x="40" y="110" width="1320" height="942" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="64" y="144" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Request time</text><rect x="470" y="170" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="200.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Employee (principal)</text><text x="700.0" y="222.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Identity passed via OAuth</text><text x="916" y="194" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">4</text><path d="M700,240 L700,275" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="470" y="276" width="460" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="303.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Input guards</text><text x="700.0" y="325.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Input classifier</text><text x="700.0" y="345.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Jailbreak detection</text><text x="916" y="300" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">5</text><path d="M700,362 L700,397" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="470" y="398" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="428.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Semantic cache</text><text x="700.0" y="450.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Repeat query → stored answer</text><text x="916" y="422" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">6</text><path d="M700,468 L700,503" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="470" y="504" width="460" height="240" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="500" y="538" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Company AI agent</text><rect x="500" y="558" width="400" height="68" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="587.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">System prompt</text><text x="700.0" y="609.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Name · persona · tone</text><text x="886" y="582" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">1</text><rect x="500" y="646" width="400" height="68" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="675.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Model router</text><text x="700.0" y="697.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Simple → small, hard → frontier</text><text x="886" y="670" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">6</text><path d="M700,744 L700,779" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="470" y="780" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="810.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Output guard</text><text x="700.0" y="832.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">PII redaction: SALARY [REDACTED]</text><text x="916" y="804" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">5</text><path d="M700,850 L700,885" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="470" y="886" width="460" height="56" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="920.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">User-visible output</text><rect x="68" y="490" width="340" height="300" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="92" y="524" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Knowledge (RAG)</text><text x="384" y="524" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">2</text><rect x="98" y="540" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="569.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Policy documents</text><rect x="98" y="610" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="639.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Chunk + embed</text><path d="M238.0,586 L238.0,609" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="98" y="680" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="709.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Vector database</text><path d="M238.0,656 L238.0,679" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><text x="238" y="764" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">returns retrieved context</text><path d="M378,703.0 L469,703.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="992" y="490" width="340" height="300" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="1016" y="524" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Capability (MCP)</text><text x="1308" y="524" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">3</text><rect x="1022" y="540" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="564.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">RBAC check</text><text x="1162.0" y="586.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Caller&#x27;s OAuth role</text><text x="1288" y="564" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">4</text><rect x="1022" y="622" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="651.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">MCP servers</text><path d="M1162.0,598 L1162.0,621" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="1022" y="692" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="721.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">HR · Jira · Slack</text><path d="M1162.0,668 L1162.0,691" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M930,569.0 L1021,569.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="68" y="974" width="1264" height="50" rx="8" fill="#efefeb" stroke="#c9c9c2" stroke-width="1.4"/><text x="700" y="1005" font-size="16" font-weight="400" fill="#1b1b19" text-anchor="middle">Observability: tool-call traces and prompt logs on every step above</text><text x="1310" y="1005" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><rect x="40" y="1080" width="1320" height="222" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="64" y="1114" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Change time (steps 7–8)</text><rect x="68" y="1134" width="286" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="211.0" y="1161.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Change</text><text x="211.0" y="1183.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">System prompt, model,</text><text x="211.0" y="1203.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">index, tools</text><rect x="394" y="1134" width="286" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="537.0" y="1161.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Evaluation suite</text><text x="537.0" y="1183.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Cases from every</text><text x="537.0" y="1203.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">past failure</text><path d="M354,1177 L393,1177" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="720" y="1134" width="286" height="86" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="863.0" y="1161.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Release gate</text><text x="863.0" y="1183.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Ships only on pass;</text><text x="863.0" y="1203.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">no skip path</text><path d="M680,1177 L719,1177" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><rect x="1046" y="1134" width="286" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1189.0" y="1161.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Agent above</text><text x="1189.0" y="1183.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Next version</text><text x="1189.0" y="1203.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">goes live</text><path d="M1006,1177 L1045,1177" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head-b2b2aa)"/><path d="M211,1220 L211,1250 L1189,1250 L1189,1222" fill="none" stroke="#cf3a2f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#head-cf3a2f)"/><text x="700" y="1282" font-size="14" font-weight="500" fill="#cf3a2f" text-anchor="middle">What happened: evals skipped → “I&#x27;m ChatGPT” (identity regression)</text></svg>
