<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b2b2aa"/></marker></defs><rect width="1400" height="1400" fill="#fff"/><text x="40" y="54" font-size="28" font-weight="700" fill="#1b1b19" text-anchor="start">Every request crosses the controls. Every change crosses the gate.</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">The ten layers of a production AI agent in 2026. Small numbers are the layers in the guide and the template.</text><rect x="40" y="110" width="1320" height="1014" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="64" y="144" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Request time</text><rect x="470" y="170" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="200.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">User (principal)</text><text x="700.0" y="222.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">OAuth-delegated · the agent acts as this user</text><text x="916" y="194" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">6</text><path d="M700,240 L700,275" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="470" y="276" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="306.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Input guards</text><text x="700.0" y="328.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Injection classifier · retrieved text marked untrusted</text><text x="916" y="300" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><path d="M700,346 L700,381" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="470" y="382" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="412.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Prompt cache</text><text x="700.0" y="434.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Frozen prefix · cache keyed by user and release</text><text x="916" y="406" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">8</text><path d="M700,452 L700,487" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="470" y="488" width="460" height="328" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="500" y="522" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Agent harness</text><text x="900" y="522" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">the model proposes, code disposes</text><rect x="500" y="542" width="400" height="68" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="571.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Context</text><text x="700.0" y="593.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Versioned prompt · sorted tools · append-only history</text><text x="886" y="566" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">2</text><rect x="500" y="632" width="400" height="68" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="661.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Model + loop</text><text x="700.0" y="683.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Pinned snapshot · routed by difficulty · step cap</text><text x="886" y="656" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">1</text><rect x="500" y="722" width="400" height="68" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="751.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Memory</text><text x="700.0" y="773.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Compaction · old tool results cleared, restorable</text><text x="886" y="746" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">5</text><path d="M700,816 L700,851" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="470" y="852" width="460" height="70" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="882.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Output guard</text><text x="700.0" y="904.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Cites a source or abstains · PII redacted</text><text x="916" y="876" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><path d="M700,922 L700,957" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="470" y="958" width="460" height="56" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="700.0" y="992.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">User-visible answer</text><rect x="68" y="440" width="340" height="428" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="92" y="474" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Knowledge (retrieval)</text><text x="384" y="474" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">3</text><rect x="98" y="490" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="519.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Documents + ACLs</text><rect x="98" y="560" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="584.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Contextual chunks</text><text x="238.0" y="606.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">structure-aware, title &gt; heading</text><path d="M238.0,536 L238.0,559" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="98" y="642" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="666.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Hybrid index</text><text x="238.0" y="688.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">BM25 + dense, fused by RRF</text><path d="M238.0,618 L238.0,641" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="98" y="724" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="238.0" y="748.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Filter, then rank</text><text x="238.0" y="770.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">ACL first; abstain when unsure</text><path d="M238.0,700 L238.0,723" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><text x="238" y="816" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">returns cited passages, marked untrusted</text><path d="M378,753.0 L469,753.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="992" y="440" width="340" height="428" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="1016" y="474" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Tools (MCP)</text><text x="1308" y="474" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">4</text><rect x="1022" y="490" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="514.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Policy check</text><text x="1162.0" y="536.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">the user&#x27;s own permissions</text><text x="1288" y="514" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">6</text><rect x="1022" y="572" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="596.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Lethal-trifecta rule</text><text x="1162.0" y="618.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">private + untrusted + outbound → ask</text><text x="1288" y="596" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="end">7</text><path d="M1162.0,548 L1162.0,571" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="1022" y="654" width="280" height="58" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="678.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Approval + ledger</text><text x="1162.0" y="700.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">writes wait for a person, run once</text><path d="M1162.0,630 L1162.0,653" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="1022" y="736" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="765.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">MCP servers</text><path d="M1162.0,712 L1162.0,735" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="1022" y="806" width="280" height="46" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1162.0" y="835.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">HR · Jira · Slack</text><path d="M1162.0,782 L1162.0,805" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><path d="M930,519.0 L1021,519.0" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="68" y="1046" width="1264" height="50" rx="8" fill="#efefeb" stroke="#c9c9c2" stroke-width="1.4"/><text x="700" y="1077" font-size="16" font-weight="400" fill="#1b1b19" text-anchor="middle">Traces on every step above: OpenTelemetry GenAI spans with the release version; content capture off by default</text><text x="1310" y="1077" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">9</text><rect x="40" y="1152" width="1320" height="220" rx="12" fill="#fff" stroke="#e2e2dc" stroke-width="1.4"/><text x="64" y="1186" font-size="17" font-weight="600" fill="#1b1b19" text-anchor="start">Change time</text><text x="1336" y="1186" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="end">10</text><rect x="68" y="1206" width="286" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="211.0" y="1233.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Change</text><text x="211.0" y="1255.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Prompt, model, tools,</text><text x="211.0" y="1275.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">index or settings</text><rect x="394" y="1206" width="286" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="537.0" y="1233.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Release bundle</text><text x="537.0" y="1255.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">One hash over all of them,</text><text x="537.0" y="1275.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">stamped on every trace</text><path d="M354,1249 L393,1249" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="720" y="1206" width="286" height="86" rx="8" fill="#e9f0fc" stroke="#2f6fde" stroke-width="2"/><text x="863.0" y="1233.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Eval gate</text><text x="863.0" y="1255.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">pass^k on every case;</text><text x="863.0" y="1275.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">regression and safety at 100%</text><path d="M680,1249 L719,1249" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><rect x="1046" y="1206" width="286" height="86" rx="8" fill="#fff" stroke="#c9c9c2" stroke-width="1.4"/><text x="1189.0" y="1233.0" font-size="16" font-weight="600" fill="#1b1b19" text-anchor="middle">Ships</text><text x="1189.0" y="1255.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">Next version goes live;</text><text x="1189.0" y="1275.0" font-size="14" font-weight="400" fill="#5d5d58" text-anchor="middle">the last one stays for rollback</text><path d="M1006,1249 L1045,1249" fill="none" stroke="#b2b2aa" stroke-width="1.6" marker-end="url(#head)"/><path d="M211,1292 L211,1322 L1189,1322 L1189,1294" fill="none" stroke="#b2b2aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#head)"/><circle cx="700" cy="1322" r="11" fill="#fff" stroke="#cf3a2f" stroke-width="1.8"/><path d="M694,1316 L706,1328 M706,1316 L694,1328" stroke="#cf3a2f" stroke-width="1.8"/><text x="700" y="1356" font-size="14" font-weight="500" fill="#cf3a2f" text-anchor="middle">No skip path: a prompt edit is a release</text></svg>
