<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="484" viewBox="0 0 1400 484" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="head-b2b2aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b2b2aa"/></marker><marker id="head-cf3a2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#cf3a2f"/></marker></defs><rect width="1400" height="484" fill="#fff"/><text x="40" y="54" font-size="28" font-weight="700" fill="#1b1b19" text-anchor="start">Contextual chunks and reranking cut retrieval failures by two thirds</text><text x="40" y="86" font-size="16" font-weight="400" fill="#5d5d58" text-anchor="start">Top-20 retrieval failure rate in Anthropic&#x27;s contextual-retrieval experiments. Lower is better.</text><line x1="330" y1="140" x2="330" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="330" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">0%</text><line x1="480" y1="140" x2="480" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="480" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">1%</text><line x1="630" y1="140" x2="630" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="630" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">2%</text><line x1="780" y1="140" x2="780" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="780" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">3%</text><line x1="930" y1="140" x2="930" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="930" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">4%</text><line x1="1080" y1="140" x2="1080" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="1080" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">5%</text><line x1="1230" y1="140" x2="1230" y2="374" stroke="#e6e6e1" stroke-width="1"/><text x="1230" y="396" font-size="13" font-weight="400" fill="#8a8a83" text-anchor="middle">6%</text><text x="40" y="183" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">Embeddings</text><path d="M330,166 H1181.0 a4,4 0 0 1 4,4 V186 a4,4 0 0 1 -4,4 H330 Z" fill="#2f6fde"/><text x="1195.0" y="183" font-size="15" font-weight="600" fill="#1b1b19" text-anchor="start">5.7%</text><text x="40" y="239" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">Contextual embeddings</text><path d="M330,222 H881.0 a4,4 0 0 1 4,4 V242 a4,4 0 0 1 -4,4 H330 Z" fill="#2f6fde"/><text x="895.0" y="239" font-size="15" font-weight="600" fill="#1b1b19" text-anchor="start">3.7%</text><text x="40" y="295" font-size="15" font-weight="400" fill="#5d5d58" text-anchor="start">+ contextual BM25</text><path d="M330,278 H761.0 a4,4 0 0 1 4,4 V298 a4,4 0 0 1 -4,4 H330 Z" fill="#2f6fde"/><text x="775.0" y="295" font-size="15" font-weight="600" fill="#1b1b19" text-anchor="start">2.9%</text><text x="40" y="351" font-size="15" font-weight="400" fill="#1b1b19" text-anchor="start">+ reranking</text><path d="M330,334 H611.0 a4,4 0 0 1 4,4 V354 a4,4 0 0 1 -4,4 H330 Z" fill="#2f6fde"/><text x="625.0" y="351" font-size="15" font-weight="600" fill="#1b1b19" text-anchor="start">1.9%</text><text x="40" y="436" font-size="14" font-weight="400" fill="#8a8a83" text-anchor="start">In the template: contextual chunks are Index(situate=...); reranking is Index(rerank=..., min_score=...). Source: anthropic.com/news/contextual-retrieval</text></svg>
