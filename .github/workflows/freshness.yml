name: freshness

# Weekly: what changed since the skill's snapshot (SDKs, protocol packages, specs).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash  # with pipefail, a crash or "nothing could be checked" (exit 2) fails the job; changes are reported
        run: |
          set -o pipefail
          python skill/building-ai-agents/scripts/check_freshness.py --no-models | tee -a "$GITHUB_STEP_SUMMARY"
