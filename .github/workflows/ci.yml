name: ci

on:
  push:
  pull_request:

jobs:
  template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest -v
      - name: release gate (pass^3)
        run: python -m kit.evals examples/hr/cases.json --agent examples.hr:build --k 3
      - name: demo
        run: python -m examples.hr
