name: ci

on:
  push:
  pull_request:

jobs:
  template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest -v
      - name: release gates (pass^3)
        shell: bash
        run: |
          for example in hr support research; do
            python -m kit.evals examples/$example/cases.json --agent examples.$example:build --k 3
          done
      - name: demos
        shell: bash
        run: |
          for example in hr support research; do python -m examples.$example; done

  integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [openai_agents, claude_agent_sdk]
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pinned requirements
        run: pip install -r integrations/${{ matrix.sdk }}/requirements.txt
      - name: tests (offline, no model; none may skip)
        shell: bash
        run: |
          python -m unittest -v tests.test_${{ matrix.sdk }} 2>&1 | tee tests.log
          ! grep -q "skipped" tests.log

  benchmark-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the benchmark runner, offline (fails on any unsafe outcome with the guard on)
        run: |
          python scripts/benchmark.py run --stand-in --name "Rule-based stand-in" --k 1 --out "$RUNNER_TEMP/bench"
          python scripts/benchmark.py run --stand-in --no-guard --name "Rule-based stand-in" --k 1 --out "$RUNNER_TEMP/bench"
          python scripts/benchmark.py hash

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install the kit and use it from outside the repository
        run: |
          pip install ./template
          cd "$RUNNER_TEMP"
          python -I -c "import kit, importlib.metadata as m; from kit import Agent, Guard, Toolbox; print(m.version('ai-agent-building-kit'), kit.__file__)"
          kit-evals --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff
        run: pipx run ruff==0.14.0 check --select F,E9,B,UP --ignore UP007,B023,B904 --target-version py310 template scripts skill
