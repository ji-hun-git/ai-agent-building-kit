name: ci

on:
  push:
  pull_request:

jobs:
  template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest -v
      - name: release gate (pass^3)
        run: python -m kit.evals examples/hr/cases.json --agent examples.hr:build --k 3
      - name: demo
        run: python -m examples.hr

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff
        run: pipx run ruff==0.14.0 check --select F,E9,B,UP --ignore UP007,B023,B904 --target-version py310 template scripts skill
